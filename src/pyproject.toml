[project]
name = "mambo-backend"
version = "0.1.0"
description = "Backend API (FastAPI) for Mambo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",  # driver PostgreSQL
  "pymysql>=1.1",          # driver MySQL (DATABASE_URL decide el motor)
  "alembic>=1.13",
  "bcrypt>=4.1",
  "pyjwt>=2.8",            # firma/validación del JWT de sesión (cookie httponly)
  "python-multipart>=0.0.9",
  "pillow>=10.4",          # procesamiento de imágenes (validación, EXIF, resize)
  "pillow-heif>=0.18",     # decodifica HEIC/HEIF (fotos de iPhone) en Pillow
  "cloudinary>=1.40",      # storage de fotos en producción (STORAGE_BACKEND=cloudinary)
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "pytest>=8.0",
  "httpx>=0.27",          # TestClient de FastAPI/Starlette
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# B008 prohíbe llamar funciones en los valores por defecto de los argumentos, porque
# el resultado se evalúa una sola vez al definir la función. En FastAPI eso no es un
# descuido sino la forma de declarar dependencias e inyectar parámetros: `Depends`,
# `Query`, `File`… devuelven marcadores que el framework resuelve en cada request.
# Reescribirlos para callar al linter rompería la inyección.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Security",
  # Fábrica de dependencias propia: `Depends(require_role("admin"))` la llama al
  # importar el módulo justamente para construir la dependencia una sola vez.
  "app.platform.auth.dependencies.require_role",
]
