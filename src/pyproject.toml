[project]
name = "mambo-backend"
version = "0.1.0"
description = "Backend API (FastAPI) for Mambo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",  # driver PostgreSQL
  "pymysql>=1.1",          # driver MySQL (DATABASE_URL decide el motor)
  "alembic>=1.13",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
