 [project]
 name = "mambo-backend"
 version = "0.1.0"
 description = "Backend API (FastAPI) for Mambo."
 readme = "README.md"
 requires-python = ">=3.11"
 dependencies = [
   "fastapi>=0.115",
   "uvicorn[standard]>=0.30",
   "pydantic>=2.8",
 ]
 
 [project.optional-dependencies]
 dev = [
   "ruff>=0.5",
 ]
 
 [tool.ruff]
 line-length = 100
 target-version = "py311"
 
 [tool.ruff.lint]
 select = ["E", "F", "I", "B", "UP"]
 
