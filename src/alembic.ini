[alembic]
script_location = alembic
prepend_sys_path = .
# Deliberadamente vacio: env.py lo pisa con `settings.sqlalchemy_database_url`,
# que sale de DATABASE_URL. Dejar una cadena con usuario y contrasena aca es
# ademas la forma tipica de terminar corriendo una migracion contra la base
# equivocada cuando la variable de entorno no esta puesta.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
